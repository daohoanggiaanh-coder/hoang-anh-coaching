name: Nhắc khách qua Telegram
on:
  schedule:
    - cron: "30 23 * * *"   # 6h30 sáng giờ Việt Nam
    - cron: "0 13 * * *"    # 20h00 tối giờ Việt Nam
  workflow_dispatch:
    inputs:
      kieu:
        description: "sang hoặc toi"
        default: "sang"
concurrency: nhac
jobs:
  nhac:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Gửi nhắc
        env:
          SHEETS_WEBAPP_URL: ${{ secrets.SHEETS_WEBAPP_URL }}
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          KIEU="${{ github.event.inputs.kieu }}"
          if [ -z "$KIEU" ]; then
            if [ "${{ github.event.schedule }}" = "30 23 * * *" ]; then KIEU=sang; else KIEU=toi; fi
          fi
          python -m scripts.nhac "$KIEU"
