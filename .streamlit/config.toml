# Hoàng Anh Coaching v1.0 (2026-10-31)
[theme]
base = "light"
primaryColor = "#B8912F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F4EC"
textColor = "#1B1B1B"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
enableStaticServing = true
disconnectedSessionTTL = 3600
websocketPingInterval = 25
