<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="28%" cy="15%" r="100%">
      <stop offset="0" stop-color="#3B3327"/><stop offset=".5" stop-color="#1A1713"/><stop offset="1" stop-color="#0B0A08"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
