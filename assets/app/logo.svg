  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="9" y="9" width="494" height="494" rx="104" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <g fill="url(#gold)">
    <!-- H trái -->
    <rect x="104" y="142" width="44" height="228" rx="4"/>
    <!-- chân trái A = thân phải H (nghiêng) -->
